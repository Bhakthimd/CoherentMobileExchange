<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Sign In | CoherentMobiles</title>
  <link rel="stylesheet" href="vendor.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .auth-logo .icon {
      font-size: 32px;
    }
    .auth-logo .title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }
    .auth-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .demo-credentials-box {
      margin-top: 24px;
      padding: 14px;
      background: var(--primary-soft);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--primary-dark);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <span class="icon">🏪</span>
      <div>
        <div class="title">CoherentMobiles</div>
        <div style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Refurbished Marketplace Partner Portal</div>
      </div>
    </div>

    <h2 class="auth-title">Partner Sign In</h2>
    <p class="auth-subtitle">Enter your store code or registered business email</p>

    <div id="loginAlert" style="display:none;" class="alert-banner alert-danger"></div>

    <form id="vendorLoginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginInput">Store Code or Email</label>
        <input type="text" id="loginInput" class="form-control" placeholder="e.g. IST-IND or partner@istoreindia.com" required autofocus>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label class="form-label" for="passwordInput" style="margin-bottom:0;">Password</label>
        </div>
        <input type="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:13.5px; color:var(--text-muted);">
      Want to sell phones on CoherentMobiles?
      <a href="register.html" style="color:var(--primary); font-weight:700; text-decoration:none;">Register as a Vendor</a>
    </div>

    <div class="demo-credentials-box">
      <strong style="display:block; margin-bottom:8px;">⚡ 1-Click Demo Login (K.T. Street Stores):</strong>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button type="button" class="btn btn-sm btn-secondary" style="justify-content:flex-start; text-align:left; font-size:12px; padding:6px 10px; cursor:pointer;" onclick="fillAndLogin('IST-IND', 'Vendor@123')">
          🏪 <strong>Chamundi Mobile Galleria</strong> (<code>IST-IND</code>)
        </button>
        <button type="button" class="btn btn-sm btn-secondary" style="justify-content:flex-start; text-align:left; font-size:12px; padding:6px 10px; cursor:pointer;" onclick="fillAndLogin('APX-DST', 'Vendor@123')">
          🏪 <strong>Cauvery Phone Junction</strong> (<code>APX-DST</code>)
        </button>
        <button type="button" class="btn btn-sm btn-secondary" style="justify-content:flex-start; text-align:left; font-size:12px; padding:6px 10px; cursor:pointer;" onclick="fillAndLogin('KRS-KTS', 'Vendor@123')">
          🏪 <strong>K.T. Street Refurb Studio</strong> (<code>KRS-KTS</code>)
        </button>
        <button type="button" class="btn btn-sm btn-secondary" style="justify-content:flex-start; text-align:left; font-size:12px; padding:6px 10px; cursor:pointer;" onclick="fillAndLogin('admin@coherent.test', 'Admin@123')">
          ⚙️ <strong>System Administrator</strong> (<code>admin@coherent.test</code>)
        </button>
      </div>
    </div>
  </div>

  <script src="/customer/universal-bar.js"></script>
  <script src="vendor.js"></script>
  <script>
    function fillAndLogin(login, pwd) {
      document.getElementById("loginInput").value = login;
      document.getElementById("passwordInput").value = pwd;
      document.getElementById("vendorLoginForm").dispatchEvent(new Event('submit'));
    }

    async function handleLogin(e) {
      e.preventDefault();
      const login = document.getElementById("loginInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const alertEl = document.getElementById("loginAlert");
      const submitBtn = document.getElementById("submitBtn");

      alertEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ login, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem("cm_vendor_token", data.token);
          }
          window.location.href = "/vendor/dashboard.html";
        } else {
          alertEl.textContent = data.error || "Invalid login credentials. Please try again.";
          alertEl.style.display = "flex";
        }
      } catch (err) {
        alertEl.textContent = "Network error. Please check server connection.";
        alertEl.style.display = "flex";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In to Portal";
      }
    }

    // Check if already authenticated
    VendorApp.init("login");
  </script>
</body>
</html>
